name: LinkedIn Job Filter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-job-filter
  cancel-in-progress: false

jobs:
  filter-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOB_SEARCH_PROFILE: ${{ secrets.JOB_SEARCH_PROFILE }}
        shell: bash
        run: |
          missing=0
          for name in APIFY_API_TOKEN APIFY_TASK_ID GEMINI_API_KEY JOB_SEARCH_PROFILE; do
            if [[ -z "${!name// /}" ]]; then
              echo "::error::GitHub Secret $name is missing or empty."
              missing=1
            fi
          done
          exit "$missing"

      - name: Create private profile file
        env:
          JOB_SEARCH_PROFILE: ${{ secrets.JOB_SEARCH_PROFILE }}
        run: printf '%s' "$JOB_SEARCH_PROFILE" > job_search_profile.md

      - name: Run job filter
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ secrets.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python -m py_compile app.py
          python -u app.py

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-job-filter-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
