name: LinkedIn Job Filter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-job-filter
  cancel-in-progress: false

jobs:
  filter-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          missing=0
          for name in APIFY_API_TOKEN GEMINI_API_KEY; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::GitHub Secret $name is missing or empty."
              missing=1
            fi
          done
          if [[ -z "${APIFY_TASK_ID//[[:space:]]/}" ]]; then
            echo "::error::GitHub Actions Variable APIFY_TASK_ID is missing or empty."
            missing=1
          fi
          if [[ ! -s job_search_profile.example.md ]]; then
            echo "::error::job_search_profile.example.md is missing or empty."
            missing=1
          fi
          exit "$missing"

      - name: Run job filter
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python -m py_compile app.py
          python -u app.py

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linkedin-job-filter-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
