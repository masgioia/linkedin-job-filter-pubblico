name: LinkedIn Job Filter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-job-filter-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}
  cancel-in-progress: false

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  filter-jobs:
    name: Apify + Gemini job filtering
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate configuration
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          missing=0
          for name in APIFY_API_TOKEN GEMINI_API_KEY; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::GitHub Secret $name is missing or empty."
              missing=1
            fi
          done
          if [[ -z "${APIFY_TASK_ID//[[:space:]]/}" ]]; then
            echo "::error::GitHub Actions Variable APIFY_TASK_ID is missing or empty."
            missing=1
          fi
          exit "$missing"

      - name: Run job filter
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TASK_ID: ${{ vars.APIFY_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python -m py_compile app.py
          python -u app.py

      - name: Publish statistics to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f results/run_summary.json ]]; then
            python - <<'PY'
            import json
            import os
            from pathlib import Path

            data = json.loads(Path("results/run_summary.json").read_text(encoding="utf-8"))
            summary = [
                "## Riepilogo LinkedIn Job Filter",
                "",
                "| Statistica | Totale |",
                "|---|---:|",
                f"| Annunci ricevuti da Apify | {data.get('apify_ads_received', 0)} |",
                f"| Annunci che hanno superato la scrematura | {data.get('screening_passed', 0)} |",
                f"| Raccomandazioni APPLY | {data.get('apply_recommendations', 0)} |",
                f"| Analisi approfondite completate | {data.get('detailed_assessments_completed', 0)} |",
                f"| Annunci scartati dalla scrematura | {data.get('screening_rejected', 0)} |",
                f"| Annunci non scremati o saltati | {data.get('not_screened_or_skipped', 0)} |",
                "",
                "Il dettaglio completo è disponibile nell'artefatto `linkedin-job-filter-results`.",
                "",
            ]
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                f.write("\\n".join(summary))
            PY
          else
            echo "## Riepilogo LinkedIn Job Filter" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Il file `results/run_summary.json` non è stato generato. Controllare i log del job." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linkedin-job-filter-results
          path: results/
          if-no-files-found: warn
          retention-days: 14
